; ============================================================
; Cenario 2 - FrankenPHP (Worker Mode): Opcache + JIT
; ============================================================

memory_limit = 256M
expose_php = Off

; ---------------- Opcache ----------------
; No FrankenPHP o SAPI e nao-CLI, mas o codigo roda em processo persistente.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; ---------------- JIT ----------------
; JIT ainda ajuda em trechos CPU-bound mesmo com o boot ja amortizado.
opcache.jit = 1255
opcache.jit_buffer_size = 128M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
