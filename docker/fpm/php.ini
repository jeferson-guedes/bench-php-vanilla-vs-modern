; ============================================================
; Cenario 1 - PHP-FPM: Opcache producao + JIT modo CRITICAL
; ============================================================

memory_limit = 256M
expose_php = Off

; ---------------- Opcache (producao) ----------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Producao: nao revalida timestamps dos arquivos (codigo e imutavel na imagem)
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; ---------------- JIT (modo CRITICAL) ----------------
; 1255 = CRTO: tracing JIT agressivo (recomendado p/ cargas CPU-bound)
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; ---------------- Realpath cache ----------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ---------------- Preload (opcional) ----------------
; Descomente para pre-carregar o container do Symfony no Opcache.
; Ganho extra de boot no FPM, ao custo de mais fragilidade na inicializacao.
; opcache.preload = /app/var/cache/prod/App_KernelProdContainer.preload.php
; opcache.preload_user = www-data
