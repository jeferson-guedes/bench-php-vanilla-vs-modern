# Cenario 1 - Nginx na frente do PHP-FPM via FastCGI (Unix socket)
server {
    listen 80 default_server;
    server_name _;

    # O Nginx nao precisa ter o codigo: o SCRIPT_FILENAME e fixo e resolvido
    # dentro do container FPM. Como /app/public nao existe aqui, o try_files
    # sempre cai no rewrite para /index.php.
    root /app/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /app/public;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;

        # Acessivel apenas via rewrite interno (impede /index.php direto)
        internal;
    }

    # Bloqueia execucao de qualquer outro .php
    location ~ \.php$ {
        return 404;
    }

    access_log off;
    error_log /var/log/nginx/error.log warn;
}
