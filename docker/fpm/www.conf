[www]
user = www-data
group = www-data

; ---- Unix socket compartilhado com o Nginx (via volume "phpsocket") ----
listen = /var/run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
; 0666 para permitir acesso do Nginx (uid diferente) atraves do volume.
listen.mode = 0666

; ---- Process manager: static p/ benchmark previsivel ----
; 4 workers para igualar FrankenPHP/Swoole (comparativo justo do runtime).
pm = static
pm.max_children = 4
pm.max_requests = 0

; Mantem variaveis de ambiente (DATABASE_URL, APP_*) visiveis ao app
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
